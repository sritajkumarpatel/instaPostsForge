name: Daily post
run-name: "Daily post: ${{ inputs.mode || 'post' }}${{ inputs.profile && format(' ({0})', inputs.profile) || '' }}"

on:
  schedule:
    - cron: "30 13 * * *"  # 13:30 UTC = 7:00 pm IST. Change to your audience's best time; GitHub may start it a few minutes late.
  workflow_dispatch:
    inputs:
      profile:
        description: Profile from config/profiles.yaml (empty = every profile in the PROFILES variable)
        default: ""
      mode:
        description: check (keys and folder), plan (next 7 days), preview (no posting) or post
        type: choice
        options: [check, plan, preview, post]
        default: preview

permissions:
  contents: write  # stage the photo on the media branch and commit state/ after each post

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    name: ${{ inputs.mode || 'post' }} (${{ matrix.profile }})
    # Scheduled runs wait until you set the repository variable AUTO_POST to true, after a
    # manual run in post mode has worked. Manual runs always go ahead.
    if: github.event_name != 'schedule' || vars.AUTO_POST == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1  # one profile at a time, so state commits never race
      matrix:
        # Scheduled runs post to every profile listed in the repository variable PROFILES,
        # a JSON list such as ["main","travel"] (Settings > Secrets and variables > Actions > Variables).
        profile: ${{ fromJSON(inputs.profile && format('["{0}"]', inputs.profile) || vars.PROFILES || '["main"]') }}
    env:
      PROFILE: ${{ matrix.profile }}
      MODE: ${{ inputs.mode || 'post' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Run forge
        run: forge "$MODE" --profile "$PROFILE"
        # Secrets are given to this step only, never to installs or third-party actions.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # One set of three secrets per profile. Add lines here when you add a profile.
          IG_MAIN_ACCESS_TOKEN: ${{ secrets.IG_MAIN_ACCESS_TOKEN }}
          IG_MAIN_USER_ID: ${{ secrets.IG_MAIN_USER_ID }}
          DRIVE_FOLDER_MAIN: ${{ secrets.DRIVE_FOLDER_MAIN }}
          # IG_TRAVEL_ACCESS_TOKEN: ${{ secrets.IG_TRAVEL_ACCESS_TOKEN }}
          # IG_TRAVEL_USER_ID: ${{ secrets.IG_TRAVEL_USER_ID }}
          # DRIVE_FOLDER_TRAVEL: ${{ secrets.DRIVE_FOLDER_TRAVEL }}
      - name: Save what the workflow learned
        # Commits posts, photo analyses, insights and the token usage log, even when the run stops early.
        if: always() && env.MODE != 'check'
        run: |
          git config user.name "instaPostsForge bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "Update state for $PROFILE ($MODE)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Keep the preview
        if: env.MODE == 'preview'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-${{ env.PROFILE }}
          path: drafts/
          retention-days: 3  # artifacts of a public repo can be downloaded by any GitHub user
