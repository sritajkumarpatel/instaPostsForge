[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "instapostsforge"
version = "0.2.0"
description = "Posts one photo a day to Instagram with an AI-written caption, quote and hashtags."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3,<3",
    "google-genai>=2.33,<3",
    "openai>=3.40,<4",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
forge = "instapostsforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
instapostsforge = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
