name: Start fresh
run-name: "Start fresh: ${{ inputs.profile }}"

# Run once after copying this repo, so your profile starts with no posting history, photo
# analyses or usage from the copy you started from. Also clears your own history later on.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile to clear (from config/profiles.yaml)
        default: main
      confirm:
        description: Type the profile name again to confirm
        default: ""
      keep_catalog:
        description: Keep the photo analyses (only for your own photos, to save re-analysing them)
        type: boolean
        default: false

permissions:
  contents: write  # commit the cleared state/

concurrency:
  group: daily-post  # never at the same time as a posting run
  cancel-in-progress: false

jobs:
  reset:
    if: inputs.confirm == inputs.profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROFILE: ${{ inputs.profile }}
      KEEP_CATALOG: ${{ inputs.keep_catalog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Clear state
        run: forge reset --profile "$PROFILE" ${{ inputs.keep_catalog && '--keep-catalog' || '' }}
      - name: Commit
        run: |
          git config user.name "instaPostsForge bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A state/
          git diff --cached --quiet && exit 0
          git commit -m "Start fresh for $PROFILE"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
