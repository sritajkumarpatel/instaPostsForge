name: Daily post

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile from config/profiles.yaml
        default: main
      mode:
        description: preview (no posting) or post
        type: choice
        options: [preview, post]
        default: preview
  # Turn on once a manual run has posted successfully. Times are UTC.
  # schedule:
  #   - cron: "30 13 * * *"

permissions:
  contents: write  # to commit state/<profile>.json after each post

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROFILE: ${{ inputs.profile || 'main' }}
      MODE: ${{ inputs.mode || 'post' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_MAIN_ACCESS_TOKEN: ${{ secrets.IG_MAIN_ACCESS_TOKEN }}
      IG_MAIN_USER_ID: ${{ secrets.IG_MAIN_USER_ID }}
      GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - run: forge "$MODE" --profile "$PROFILE"
      - name: Save the post log
        if: env.MODE == 'post'
        run: |
          git config user.name "instaPostsForge bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Record post for $PROFILE"
          git push
      - name: Keep the preview
        if: env.MODE == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ env.PROFILE }}
          path: drafts/
