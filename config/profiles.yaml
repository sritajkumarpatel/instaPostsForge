# Each profile is one Instagram account fed by one Google Drive folder.
# To post to another account or from another folder, copy the "main" block under a new
# name and point it at different environment variables.
#
# This repo is public, so this file must never hold secrets or the Drive folder link.
# It only names the variables in .env (and GitHub secrets) that hold them.

defaults:
  ai:
    provider: claude
    # Default model, effort and output limit for every AI step. Each step can override
    # them under "agents" below. Effort: low | medium | high | xhigh | max (more effort
    # means more thinking, better judgement and more tokens).
    # Sonnet keeps quality high at half Opus's price; lower effort means less thinking and
    # fewer output tokens. For the best captions, set caption_writer to claude-opus-5-5.
    model: claude-sonnet-5-5
    effort: low
    max_tokens: 8000
    agents:
      analyst:        { effort: low }      # runs once per new photo
      planner:        { effort: low }
      caption_writer: { effort: medium }   # the step readers see most
      hashtags:       { effort: low }
      reviewer:       { effort: low }
    # Standing instructions every AI step follows (voice, topics to avoid, and so on).
    instructions_file: config/ai-instructions.md
    # Per-category and per-mood rules. Each step gets only the sections for the photo's
    # category and mood. A profile can point to its own folder.
    playbooks_dir: config/playbooks
    # What the account is about. Every AI step reads this, so fill it in per profile:
    # without it captions stay generic. Leave a field empty to skip it.
    account:
      niche: ""               # e.g. "street and travel photography in India"
      audience: ""            # e.g. "people who love slow travel and everyday street life"
      location: ""            # e.g. "Bengaluru, India" (helps with seasons and festivals)
      voice: ""               # e.g. "warm, observant, a little dry humour"
      avoid: ""               # e.g. "food puns, the word 'wanderlust'"
      ending_style: ""        # e.g. "a question about the reader's own city"
    planning:
      no_repeat_category: false       # true: never the same category (macro, animals...) as the last post or yesterday's
      no_repeat_subject_days: 3       # a main subject (moon, dog...) waits this many days before it comes back
      max_same_mood_per_7_days: 2
    # USD per million tokens, used only to estimate cost in the usage log.
    pricing:
      claude-opus-5-5:   { input: 4.00,  output: 20.00 }
      claude-sonnet-5-5: { input: 2.00,  output: 10.00 }
      claude-haiku-5-5:  { input: 0.10,  output: 0.50 }
      claude-fable-5-1:  { input: 10.00, output: 50.00 }
    language: English
    quote: when_fitting       # always | when_fitting | never
    hashtags:
      min: 3
      max: 5                  # Instagram allows at most 5 hashtags per post
    max_caption_chars: 2200
    max_caption_text_chars: 150   # caption text alone (no quote or tags); code drops body sentences past this
    review: true              # the reviewer checks every post before it goes out
    max_revisions: 2          # how many times the reviewer may send a post back
    on_review_reject: skip    # skip (no post that day) | post (post the last draft anyway)
    max_new_analyses_per_run: 20
    extra_instructions: ""    # optional, anything the AI should always keep in mind
  selection:
    strategy: ai_planner      # ai_planner | random | ordered
    when_exhausted: stop      # stop (fail and ask for more photos) | recycle (start over)
    max_candidates: 60
    # Content rules, enforced in code whatever the AI says.
    min_quality: 4            # photos scoring lower are used only when nothing better is left
    skip_screenshots: true    # never post screenshots, memes or photos of documents
    allow_children: false     # photos where a child is visible are skipped unless true
    near_duplicate_days: 30   # keep a near-identical photo at least this many days from the first
    # Multi-photo (carousel) posts: on some days the planner may post 2 to max_photos photos from
    # one outing or one place instead of a single photo. Only photos of the same shape share a post,
    # so each goes out exactly as shot, with no added border. The MULTI_PHOTO environment variable
    # (a repository variable in GitHub Actions) overrides "enabled": set it to false to turn
    # multi-photo posts off without a commit.
    multi_photo:
      enabled: true
      max_photos: 5           # Instagram allows up to 10
      max_per_7_days: 3       # at most this many multi-photo posts in any 7 posts
      group_hours: 3          # photos taken within this many hours of the previous one form an outing
      group_km: 2             # ...and within this many km of it, when both have GPS (never saved)
  image:
    keep_aspect_ratio: true
    min_ratio: 0.8            # 4:5 portrait, the tallest Instagram feed shape
    max_ratio: 1.91           # 1.91:1 landscape, the widest
    max_width: 1440
    jpeg_quality: 90
    max_crop: 0.1             # a 3:4 portrait loses a thin centred strip (6%) to reach 4:5 instead of getting side borders
    pad_color: auto           # border colour, only for photos that would lose more than max_crop: auto or a hex like "#ffffff"
  hosting:
    type: github              # Instagram can't read Drive links; the photo is staged here briefly
    branch: media
    token_env: GITHUB_TOKEN
    repository_env: GITHUB_REPOSITORY
  instagram:
    api_version: v23.0
    insight_metrics: reach,likes,comments,saved,shares

profiles:
  main:
    instagram:
      access_token_env: IG_MAIN_ACCESS_TOKEN
      user_id_env: IG_MAIN_USER_ID
    source:
      type: google_drive
      folder_url_env: DRIVE_FOLDER_MAIN   # the folder's share link lives in this secret
      auth: api_key                       # api_key | service_account
      api_key_env: GOOGLE_DRIVE_API_KEY
      service_account_file_env: GOOGLE_SERVICE_ACCOUNT_FILE
    ai:
      # Filled in from the current Instagram grid. Edit freely as the account evolves.
      account:
        niche: >-
          Mobile photography from Bengaluru and around Karnataka: macro flowers and nature,
          wildlife (Bannerghatta, Bandipura), pets, moon and night skies, heritage
          architecture (Mysuru), temples and festivals, and cafés
        audience: >-
          Photography and mobile-photography enthusiasts, and people who love Bengaluru,
          Mysuru and travel around Karnataka
        location: Bengaluru, Karnataka, India
        voice: >-
          Observant and warm, like a friend who noticed a small detail on a walk.
          Simple, specific words; calm by default, playful with pets
        avoid: >-
          "wanderlust", "vibes", "nature is healing", stacked superlatives, and
          technical camera jargon in the caption itself
        ending_style: >-
          A short question about the reader's own spots, pets or memories in
          Bengaluru or Karnataka
      extra_instructions: >-
        Every photo carries a small "OPPO Find X9 Ultra | Hasselblad" camera watermark,
        sometimes with focal length, date or place. It is the photographer's own
        signature: ignore it when judging the photo, don't count it as text or a logo,
        and don't mention the phone or Hasselblad in captions or hashtags. When the
        watermark or file name shows a place (for example Bengaluru or Bannerghatta),
        that place may be used as place_name.

  # A second account, fed from its own Drive folder. Remove the leading "#"s to use it,
  # then add IG_TRAVEL_ACCESS_TOKEN and DRIVE_FOLDER_TRAVEL to .env and GitHub secrets.
