name: Daily post

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile from config/profiles.yaml
        default: main
      mode:
        description: preview (no posting), plan (next 7 days) or post
        type: choice
        options: [preview, plan, post]
        default: preview
  # Turn on once a manual run has posted successfully. Times are UTC.
  # schedule:
  #   - cron: "30 13 * * *"

permissions:
  contents: write  # stage the photo on the media branch and commit state/ after each post

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROFILE: ${{ inputs.profile || 'main' }}
      MODE: ${{ inputs.mode || 'post' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_MAIN_ACCESS_TOKEN: ${{ secrets.IG_MAIN_ACCESS_TOKEN }}
      IG_MAIN_USER_ID: ${{ secrets.IG_MAIN_USER_ID }}
      DRIVE_FOLDER_MAIN: ${{ secrets.DRIVE_FOLDER_MAIN }}
      GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - run: forge "$MODE" --profile "$PROFILE"
      - name: Save what the workflow learned
        # Commits posts, photo analyses and insights, even when the run stops early.
        if: always() && env.MODE != 'plan'
        run: |
          git config user.name "instaPostsForge bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "Update state for $PROFILE ($MODE)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Keep the preview
        if: env.MODE == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ env.PROFILE }}
          path: drafts/
