name: Daily post
run-name: "Daily post: ${{ inputs.mode || 'post' }}${{ inputs.profile && format(' ({0})', inputs.profile) || '' }}${{ ((inputs.provider != 'variable' && inputs.provider) || vars.AI_PROVIDER) && format(' · {0}', (inputs.provider != 'variable' && inputs.provider) || vars.AI_PROVIDER) || '' }}${{ ((inputs.source != 'variable' && inputs.source) || vars.PHOTO_SOURCE) && format(' · {0}', (inputs.source != 'variable' && inputs.source) || vars.PHOTO_SOURCE) || '' }}"

on:
  schedule:
    - cron: "30 13 * * *"  # 13:30 UTC = 7:00 pm IST. Change to your audience's best time; GitHub may start it a few minutes late.
  workflow_dispatch:
    inputs:
      profile:
        description: Profile from config/profiles.yaml (empty = every profile in the PROFILES variable)
        default: ""
      mode:
        description: check (keys and folder), plan (next 7 days), preview (no posting) or post
        type: choice
        options: [check, plan, preview, post]
        default: preview
      provider:
        description: AI provider for this run (variable = the AI_PROVIDER repository variable, or config if unset)
        type: choice
        options: [variable, claude, openai, gemini]
        default: variable
      source:
        description: Where the photos come from for this run (variable = the PHOTO_SOURCE repository variable, or config if unset)
        type: choice
        options: [variable, google_drive, r2]
        default: variable

permissions:
  contents: write  # stage the photo on the media branch and commit state/ after each post

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    name: ${{ inputs.mode || 'post' }} (${{ matrix.profile }})
    # Scheduled runs wait until you set the repository variable AUTO_POST to true, after a
    # manual run in post mode has worked. Manual runs always go ahead.
    if: github.event_name != 'schedule' || vars.AUTO_POST == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1  # one profile at a time, so state commits never race
      matrix:
        # Scheduled runs post to every profile listed in the repository variable PROFILES,
        # a JSON list such as ["main","travel"] (Settings > Secrets and variables > Actions > Variables).
        profile: ${{ fromJSON(inputs.profile && format('["{0}"]', inputs.profile) || vars.PROFILES || '["main"]') }}
    env:
      PROFILE: ${{ matrix.profile }}
      MODE: ${{ inputs.mode || 'post' }}
      # claude | openai | gemini. A manual run's choice wins, then the repository variable AI_PROVIDER;
      # empty means ai.provider in config/profiles.yaml decides. forge stops early if that provider's key is missing.
      AI_PROVIDER: ${{ (inputs.provider != 'variable' && inputs.provider) || vars.AI_PROVIDER || '' }}
      # google_drive | r2. Same order: the manual choice, then the repository variable PHOTO_SOURCE, then
      # source.type in config. Each source keeps its own photos, so switching is a fresh start.
      PHOTO_SOURCE: ${{ (inputs.source != 'variable' && inputs.source) || vars.PHOTO_SOURCE || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Run forge
        run: forge "$MODE" --profile "$PROFILE"
        # Secrets are given to this step only, never to installs or third-party actions.
        env:
          # Repository variable: set MULTI_PHOTO to false to post single photos only. Unset, config decides.
          # Saved as a repository secret by mistake, it still works.
          MULTI_PHOTO: ${{ vars.MULTI_PHOTO || secrets.MULTI_PHOTO }}
          # Only the chosen provider's key is handed over (all three when config decides).
          ANTHROPIC_API_KEY: ${{ (env.AI_PROVIDER == '' || env.AI_PROVIDER == 'claude') && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ (env.AI_PROVIDER == '' || env.AI_PROVIDER == 'openai') && secrets.OPENAI_API_KEY || '' }}
          GEMINI_API_KEY: ${{ (env.AI_PROVIDER == '' || env.AI_PROVIDER == 'gemini') && secrets.GEMINI_API_KEY || '' }}
          # Only the chosen photo source's secrets are handed over (both sets when config decides).
          GOOGLE_DRIVE_API_KEY: ${{ (env.PHOTO_SOURCE == '' || env.PHOTO_SOURCE == 'google_drive') && secrets.GOOGLE_DRIVE_API_KEY || '' }}
          R2_ACCOUNT_ID: ${{ (env.PHOTO_SOURCE == '' || env.PHOTO_SOURCE == 'r2') && secrets.R2_ACCOUNT_ID || '' }}
          R2_ACCESS_KEY_ID: ${{ (env.PHOTO_SOURCE == '' || env.PHOTO_SOURCE == 'r2') && secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ (env.PHOTO_SOURCE == '' || env.PHOTO_SOURCE == 'r2') && secrets.R2_SECRET_ACCESS_KEY || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # One set of secrets per profile (with R2, R2_BUCKET_<PROFILE> instead of DRIVE_FOLDER_<PROFILE>). Add lines here when you add a profile.
          IG_MAIN_ACCESS_TOKEN: ${{ secrets.IG_MAIN_ACCESS_TOKEN }}
          IG_MAIN_USER_ID: ${{ secrets.IG_MAIN_USER_ID }}
          DRIVE_FOLDER_MAIN: ${{ (env.PHOTO_SOURCE == '' || env.PHOTO_SOURCE == 'google_drive') && secrets.DRIVE_FOLDER_MAIN || '' }}
          R2_BUCKET_MAIN: ${{ (env.PHOTO_SOURCE == '' || env.PHOTO_SOURCE == 'r2') && secrets.R2_BUCKET_MAIN || '' }}
          # IG_TRAVEL_ACCESS_TOKEN: ${{ secrets.IG_TRAVEL_ACCESS_TOKEN }}
          # IG_TRAVEL_USER_ID: ${{ secrets.IG_TRAVEL_USER_ID }}
          # DRIVE_FOLDER_TRAVEL: ${{ secrets.DRIVE_FOLDER_TRAVEL }}
      - name: Save what the workflow learned
        # Commits posts, photo analyses, insights and the token usage log, even when the run stops early.
        if: always() && env.MODE != 'check'
        run: |
          git config user.name "instaPostsForge bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "Update state for $PROFILE ($MODE)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Keep the token audit report
        # Tokens and estimated cost per phase, per agent and per call, for every run, scheduled or manual.
        if: always() && env.MODE != 'check'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: token-audit-${{ env.PROFILE }}-${{ env.MODE }}-${{ github.run_number }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 90
      - name: Keep the preview
        if: env.MODE == 'preview'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-${{ env.PROFILE }}
          path: drafts/
          retention-days: 3  # artifacts of a public repo can be downloaded by any GitHub user
